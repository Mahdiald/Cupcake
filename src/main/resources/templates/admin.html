<!doctype html><html lang="da" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="logo" href="/">🧁 Copenhagen Cupcakes</a><nav><a th:if="${email != null}" href="/account" class="balance-pill">💳 <span th:text="${balance + ' kr.'}">0.00 kr.</span></a><a th:if="${email != null}" href="/account">Min konto</a><span th:text="${email}"></span><a href="/">Til shoppen</a></nav></header><main class="panel"><h1>Administrationspanel</h1><h2>Ordrer</h2><div class="table-wrap"><table><thead><tr><th>Nr.</th><th>Kunde</th><th>Dato</th><th>Beløb</th><th></th></tr></thead><tbody><tr th:each="o:${orders}"><td th:text="${o.id}"></td><td th:text="${o.email}"></td><td th:text="${o.created}"></td><td th:text="${o.total + ' kr.'}"></td><td><form method="post" action="/admin/orders/delete" onsubmit="return confirm('Slet ordren?')"><input type="hidden" name="orderId" th:value="${o.id}"><button>Slet</button></form></td></tr></tbody></table></div><h2>Kunder</h2><div class="table-wrap"><table><thead><tr><th>Nr.</th><th>Email</th><th>Saldo</th><th>Antal ordrer</th></tr></thead><tbody><tr th:each="u:${users}"><td th:text="${u.id}"></td><td th:text="${u.email}"></td><td th:text="${u.balance + ' kr.'}"></td><td th:text="${u.orderCount}"></td></tr></tbody></table></div></main></body></html>
