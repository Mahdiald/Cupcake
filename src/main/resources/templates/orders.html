<!doctype html><html lang="da" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mine ordrer</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="logo" href="/">🧁 Copenhagen Cupcakes</a><nav><a th:if="${email != null}" href="/account" class="balance-pill">💳 <span th:text="${balance + ' kr.'}">0.00 kr.</span></a><a th:if="${email != null}" href="/account">Min konto</a><span th:text="${email}"></span><a href="/">Til shoppen</a></nav></header><main class="panel"><h1>Mine ordrer</h1><p th:if="${#lists.isEmpty(orders)}">Du har endnu ingen ordrer.</p><table th:if="${!#lists.isEmpty(orders)}"><thead><tr><th>Ordrenr.</th><th>Dato</th><th>Beløb</th></tr></thead><tbody><tr th:each="o:${orders}"><td th:text="${o.id}"></td><td th:text="${o.created}"></td><td th:text="${o.total + ' kr.'}"></td></tr></tbody></table></main></body></html>
