<!doctype html><html lang="da" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Konto</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="logo" href="/">🧁 Copenhagen Cupcakes</a><nav><a th:if="${email != null}" href="/account" class="balance-pill">💳 <span th:text="${balance + ' kr.'}">0.00 kr.</span></a><a th:if="${email != null}" href="/account">Min konto</a><a href="/">Til shoppen</a></nav></header><main class="narrow panel"><h1 th:text="${registration ? 'Opret konto' : 'Log ind'}"></h1><form th:action="${registration ? '/register' : '/login'}" method="post" class="stack"><label>Email<input type="email" name="email" autocomplete="email" required></label><label>Adgangskode<input type="password" name="password" minlength="8" required></label><button class="button" th:text="${registration ? 'Opret konto' : 'Log ind'}"></button></form><p><a th:href="${registration ? '/login' : '/register'}" th:text="${registration ? 'Har du en konto? Log ind' : 'Ny kunde? Opret konto'}"></a></p></main></body></html>
