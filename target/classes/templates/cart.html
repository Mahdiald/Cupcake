<!doctype html><html lang="da" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kurv</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="logo" href="/">🧁 Copenhagen Cupcakes</a><nav><a th:if="${email != null}" href="/account" class="balance-pill">💳 <span th:text="${balance + ' kr.'}">0.00 kr.</span></a><a th:if="${email != null}" href="/account">Min konto</a><span th:if="${email != null}" th:text="${email}"></span><a href="/">Til shoppen</a></nav></header><main class="panel"><h1>Din indkøbskurv</h1><p th:if="${#lists.isEmpty(lines)}">Kurven er tom.</p><div class="cart-line" th:each="line,stat:${lines}"><div><strong th:text="${line.bottom + ' + ' + line.topping}"></strong><p th:text="${line.quantity + ' stk. × ' + line.unitPrice + ' kr.'}"></p></div><div><strong th:text="${line.total + ' kr.'}"></strong><form action="/cart/remove" method="post"><input type="hidden" name="index" th:value="${stat.index}"><button>Fjern</button></form></div></div><h2 th:text="${'I alt: ' + total + ' kr.'}"></h2><form th:if="${!#lists.isEmpty(lines) and email != null}" action="/checkout" method="post"><button class="button">Betal med kontosaldo</button></form><p th:if="${email == null and !#lists.isEmpty(lines)}"><a class="button" href="/login">Log ind for at betale</a></p></main></body></html>
